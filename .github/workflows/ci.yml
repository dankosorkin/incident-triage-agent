name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies (locked versions)
        run: |
          pip install -r requirements-lock.txt
          pip install --no-deps -e ".[dev]"
      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pip-audit
        run: pip install pip-audit
      # chromadb==1.5.9 has four open CVEs with no patched release yet
      # (see README Design notes for the risk-acceptance reasoning).
      # Ignored explicitly by ID so a *new* vulnerability in any
      # dependency still fails this job instead of being silently
      # masked by a blanket ignore.
      - name: Audit locked dependencies
        run: |
          pip-audit -r requirements-lock.txt \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833
